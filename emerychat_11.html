<style>
  :root{
    --bg: #362a5c;
    --bg-deep: #201a3a;
    --header: #251d42;
    --surface: #f6ecf5;
    --surface-text: #3a2150;
    --mine: #5b8def;
    --mine-text: #12213f;
    --cream: #f6ecf5;
    --muted: #c1b8de;
    --accent-sage: #7fb3e3;
    --accent-brick: #e37fa3;
    --accent-plum: #8b5fbf;
    --accent-teal: #6c4ab6;
    --accent-brown: #c97ba0;
    --accent-gold: #8b5fbf;
    --radius: 18px;
    --glow: 0 0 18px rgba(139,95,191,0.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; overflow-x:hidden;}
  body{
    margin:0;
    background:radial-gradient(ellipse at top, var(--bg) 0%, var(--bg-deep) 70%);
    font-family:'Inter', sans-serif;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent-gold);
    outline-offset:2px;
  }

  header{
    background:var(--header);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    row-gap:8px;
    box-shadow:0 2px 12px rgba(0,0,0,0.25);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .logo-photo{
    width:32px;height:32px;border-radius:50%;
    object-fit:cover;
    box-shadow:var(--glow);
    flex-shrink:0;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.3rem;
    margin:0;
    letter-spacing:0.2px;
  }
  .who{
    display:flex; align-items:center; gap:8px;
    font-size:0.85rem;
    color:var(--muted);
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:0.85rem;color:#fff;
    flex-shrink:0;
  }
  .iconbtn{
    background:none;border:none;color:var(--muted);cursor:pointer;
    padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  }
  .iconbtn:hover{color:var(--cream); background:rgba(255,255,255,0.06);}

  .screen{flex:1; display:flex; flex-direction:column;}
  .hidden{display:none !important;}

  #loginScreen{
    align-items:center; justify-content:center;
    padding:32px 20px; text-align:center; gap:22px;
  }
  .login-title{font-family:'Fraunces', serif; font-size:1.6rem; font-weight:600;}
  .login-sub{color:var(--muted); font-size:0.95rem; margin-top:-14px;}
  .people-grid{
    display:flex; flex-wrap:wrap; gap:16px; justify-content:center; max-width:420px;
  }
  .person-card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:18px 22px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
    min-width:110px;
  }
  .person-card:hover{transform:translateY(-2px); background:rgba(255,255,255,0.09);}
  .person-avatar{
    width:52px;height:52px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:1.3rem; color:#fff;
  }
  .person-name{font-size:0.95rem; font-weight:500;}

  #pinScreen{align-items:center; justify-content:center; gap:18px; padding:20px;}
  .pin-dots{display:flex; gap:12px;}
  .pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3);}
  .pin-dot.filled{background:var(--accent-gold); border-color:var(--accent-gold);}
  .pin-pad{display:grid; grid-template-columns:repeat(3, 72px); gap:14px;}
  .pin-key{
    width:72px;height:72px;border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    color:var(--cream); font-size:1.4rem; cursor:pointer;
  }
  .pin-key:active{background:rgba(255,255,255,0.16);}
  .pin-error{color:var(--accent-brick); font-size:0.9rem; height:1.2em;}
  .link{background:none;border:none;color:var(--muted); text-decoration:underline; cursor:pointer; font-size:0.9rem;}

  #chatScreen{flex:1; display:flex; flex-direction:column; min-height:0;}
  .chat-list{
    display:flex; flex-direction:column; gap:10px; padding:10px 20px 20px;
    max-width:420px; margin:0 auto; width:100%;
  }
  .chat-list-item{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; cursor:pointer; transition:background .15s ease;
  }
  .chat-list-item:hover{background:rgba(255,255,255,0.09);}
  .chat-list-name{font-size:1rem; font-weight:500; flex:1;}
  .chat-list-icon{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:1.1rem; color:#fff;
    flex-shrink:0; object-fit:cover;
  }
  .convo-header{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid rgba(255,255,255,0.06); flex-shrink:0;
  }
  .convo-title{font-weight:600; font-size:1rem;}
  #messages{
    flex:1; overflow-y:auto; padding:18px 14px 10px;
    display:flex; flex-direction:column; gap:4px;
  }
  .empty-state{
    margin:auto; text-align:center; color:var(--muted); max-width:260px;
    font-size:0.95rem; line-height:1.5;
  }
  .msg-row{display:flex; flex-direction:column; max-width:78%; margin-bottom:6px;}
  .msg-row.mine{align-self:flex-end; align-items:flex-end;}
  .msg-row.theirs{align-self:flex-start; align-items:flex-start;}
  .sender-label{font-size:0.72rem; color:var(--muted); margin:6px 4px 3px;}
  .bubble{
    position:relative;
    padding:10px 14px;
    border-radius:var(--radius);
    font-size:0.98rem;
    line-height:1.4;
    word-wrap:break-word;
    box-shadow:0 3px 8px rgba(0,0,0,0.18);
  }
  .msg-row.theirs .bubble{
    background:var(--surface); color:var(--surface-text);
    border-bottom-left-radius:6px;
  }
  .msg-row.mine .bubble{
    background:var(--mine); color:var(--mine-text);
    border-bottom-right-radius:6px;
  }
  .bubble::before{
    content:"";
    position:absolute; top:-6px; width:26px; height:10px;
    background:rgba(255,255,255,0.55);
    opacity:0.5;
    transform:rotate(-4deg);
  }
  .msg-row.theirs .bubble::before{left:10px;}
  .msg-row.mine .bubble::before{right:10px; transform:rotate(4deg);}
  .timestamp{font-size:0.68rem; color:var(--muted); margin:3px 4px 0;}

  #composer{
    display:flex; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--header); border-top:1px solid rgba(255,255,255,0.06);
    position:relative; align-items:flex-end;
  }
  .composer-icon{
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    color:var(--cream); border-radius:50%; width:42px; height:42px;
    display:flex; align-items:center; justify-content:center; font-size:1.15rem;
    cursor:pointer; flex-shrink:0; padding:0;
  }
  .composer-icon:hover{background:rgba(255,255,255,0.12);}
  #gifBtn{border-radius:12px; width:auto; padding:0 10px; font-weight:700; font-size:0.72rem; letter-spacing:0.4px;}
  .emoji-panel{
    position:absolute; bottom:64px; left:14px; right:14px; max-width:420px;
    background:var(--bg-deep); border:1px solid rgba(255,255,255,0.1); border-radius:16px;
    padding:10px; display:grid; grid-template-columns:repeat(8,1fr); gap:4px; z-index:30;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .emoji-panel button{background:none;border:none;font-size:1.35rem;cursor:pointer;padding:5px;border-radius:8px;}
  .emoji-panel button:hover{background:rgba(255,255,255,0.08);}
  .bubble-media{padding:6px !important;}
  .msg-image, .msg-gif{width:220px; max-width:100%; max-height:260px; border-radius:12px; display:block; cursor:pointer; object-fit:cover;}
  .photo-placeholder{font-size:0.85rem; opacity:0.85; font-style:italic; padding:4px 6px;}
  .lightbox-overlay{position:fixed; inset:0; background:rgba(8,10,18,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:80; cursor:zoom-out; gap:16px;}
  .lightbox-overlay img{max-width:92vw; max-height:80vh; border-radius:12px;}
  .lightbox-save{
    background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3);
    border-radius:24px; padding:10px 20px; display:flex; align-items:center; gap:8px;
    color:#fff; font-size:0.9rem; font-weight:600; cursor:pointer; backdrop-filter:blur(4px);
  }
  .lightbox-save:hover{background:rgba(255,255,255,0.25);}
  .lightbox-hint{color:rgba(255,255,255,0.55); font-size:0.78rem; text-align:center; max-width:280px;}
  #msgInput{
    flex:1; min-width:0; border-radius:22px; border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.06); color:var(--cream);
    padding:12px 16px; font-size:1rem; resize:none; max-height:100px;
  }
  #msgInput::placeholder{
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #sendBtn{
    background:var(--accent-gold); border:none; color:#ffffff;
    width:46px; height:46px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #sendBtn:disabled{opacity:0.4; cursor:default;}

  .overlay{
    position:fixed; inset:0; background:rgba(10,14,22,0.72);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  @media (min-width:640px){ .overlay{align-items:center;} }
  .modal{
    background:var(--bg-deep); width:100%; max-width:480px; max-height:88vh;
    border-radius:20px 20px 0 0; padding:22px 20px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto; border:1px solid rgba(255,255,255,0.08);
  }
  @media (min-width:640px){ .modal{border-radius:20px;} }
  .modal h2{font-family:'Fraunces', serif; margin:0 0 4px; font-size:1.25rem;}
  .modal-sub{color:var(--muted); font-size:0.85rem; margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:0.82rem; color:var(--muted); margin-bottom:6px;}
  .field input[type=text]{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.05); color:var(--cream); font-size:1rem;
  }
  .swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:30px;height:30px;border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.selected{border-color:#fff;}
  .checkrow{display:flex; align-items:center; gap:8px; font-size:0.9rem; color:var(--cream);}
  .primary-btn{
    width:100%; padding:12px; border-radius:12px; border:none;
    background:var(--accent-gold); color:#ffffff; font-weight:600; font-size:0.95rem; cursor:pointer;
    margin-top:6px;
  }
  .roster-item{
    display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .roster-name{flex:1; font-size:0.95rem;}
  .roster-tag{font-size:0.7rem; color:var(--muted); background:rgba(255,255,255,0.06); padding:2px 8px; border-radius:8px;}
  .remove-btn{background:none;border:none;color:var(--accent-brick); cursor:pointer; font-size:0.82rem;}
  .pin-btn{background:none;border:none;color:var(--muted); cursor:pointer; font-size:0.82rem; margin-right:10px;}
  .pin-btn:hover{color:var(--cream);}
  .close-x{position:absolute; top:16px; right:18px; background:none; border:none; color:var(--muted); font-size:1.3rem; cursor:pointer;}
  .modal-wrap{position:relative;}
  hr.div{border:none; border-top:1px solid rgba(255,255,255,0.08); margin:18px 0;}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, set, get, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjszPGc44XFJdmjJ5gfrV9Fnva64vcYWk",
  authDomain: "emerychat-702cb.firebaseapp.com",
  databaseURL: "https://emerychat-702cb-default-rtdb.firebaseio.com/",
  projectId: "emerychat-702cb",

  appId: "1:762065364447:web:133ff50d6c918f0ca3506a"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const auth = getAuth(fbApp);
setPersistence(auth, browserLocalPersistence).catch(err=>console.error('persistence setup failed', err));
const HOUSEHOLD_EMAIL = "weilfamily@emerychat.com";
const VAPID_KEY = "BHn7lCgR6l3oF8QqlDSs_M-iiQbvNM0qiVmXMT6jlR3NVl1J6UYJtTNH2ESXK5BKBHGBZLFpZWHO5eVdJDHpeHI";

const COLORS = [
  {name:'purple', hex:'#8b5fbf'},
  {name:'blue', hex:'#5b8def'},
  {name:'pink', hex:'#e37fa3'},
  {name:'violet', hex:'#6c4ab6'},
  {name:'sky', hex:'#7fb3e3'},
  {name:'rose', hex:'#c97ba0'},
];

let config = null;

const EMOJIS = ['😀','😂','🥰','😎','😍','🤗','😉','😜','🤔','😴','😭','😱',
  '👍','👎','🙌','👏','🎉','❤️','💜','💙','🔥','⭐','✨','💯',

function colorFor(idx){ return COLORS[idx % COLORS.length].hex; }
function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

async function loadConfig(){
  try{
    const snap = await get(ref(db, 'config'));
    config = snap.exists() ? snap.val() : null;
  }catch(e){ config = null; }
  if(!config){
    config = {
      participants: [
        {id:'dad', name:'Dad', colorIdx:0, pin:null, isAdmin:true},
        {id:'mom', name:'Mom', colorIdx:1, pin:null, isAdmin:true},
        {id:'kiddo', name:'Emery', colorIdx:2, pin:null, isAdmin:false},
      ]
    };
    await saveConfig();
  }
}
async function saveConfig(){
  try{ await set(ref(db, 'config'), config); }
  catch(e){ console.error('save config failed', e); }
}

function renderPeopleGrid(){
  const grid = document.getElementById('peopleGrid');
  grid.innerHTML = '';
  config.participants.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'person-card';
    card.innerHTML = `<div class="person-avatar" style="background:${colorFor(p.colorIdx)}">${initials(p.name)}</div><div class="person-name">${escapeHtml(p.name)}</div>`;
    card.onclick = ()=> startLogin(p.id);
    grid.appendChild(card);
  });

  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];

let messagingInstance = null;

async function registerDeviceToken(token){
  try{
    const ownerSnap = await get(ref(db, 'tokenOwner/' + token));
    if(ownerSnap.exists() && ownerSnap.val() !== currentUser.id){
      await remove(ref(db, 'participantTokens/' + ownerSnap.val() + '/' + token)).catch(()=>{});
    }
    await set(ref(db, 'participantTokens/' + currentUser.id + '/' + token), Date.now());
    await set(ref(db, 'tokenOwner/' + token), currentUser.id);
  }catch(e){ console.error('token registration failed', e); }
}

async function setupMessaging(){
  try{
    const registration = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    if(!messagingInstance) messagingInstance = getMessaging(fbApp);
    const token = await getToken(messagingInstance, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if(token) await registerDeviceToken(token);
    onMessage(messagingInstance, (payload)=>{
      const title = (payload.notification && payload.notification.title) || 'EmeryChat';
      const body = (payload.notification && payload.notification.body) || 'New message';
      if(Notification.permission === 'granted'){
        new Notification(title, { body, icon: 'icon-192.png' });
      }
    });
    return true;
  }catch(e){ console.error('messaging setup failed', e); return false; }
}

async function ensureNotificationsSetup(){
  if(!('Notification' in window) || !('serviceWorker' in navigator)) return;
  if(Notification.permission === 'granted'){
    await setupMessaging();
  }
}

async function requestNotificationPermission(){
  if(!('Notification' in window) || !('serviceWorker' in navigator)){
    alert("Notifications aren't supported in this browser.");
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){
    const ok = await setupMessaging();
    alert(ok ? 'Notifications enabled!' : "Couldn't finish setting up notifications. Try again in a bit.");
    renderWhoRow();
  }else{
    alert("Notifications weren't enabled. You can allow them later in your browser or phone settings.");
  }
}

function bubbleInner(m){
  if(m.type === 'image'){
    const id = m.imageId;
    if(Object.prototype.hasOwnProperty.call(imageCache, id)){
      const val = imageCache[id];
      return val ? `<img src="${val}" class="msg-image" alt="photo" />` : `<div class="photo-placeholder">📷 Photo unavailable</div>`;
    }
    ensureImageLoaded(id);
    return `<div class="photo-placeholder">📷 Loading photo…</div>`;
  }
  if(m.type === 'gif'){
    const dims = (m.gifWidth && m.gifHeight) ? ` width="${m.gifWidth}" height="${m.gifHeight}"` : '';
    return `<img src="${m.gifUrl}" class="msg-gif" alt="gif"${dims} />`;
  }
  return escapeHtml(m.text || '');
}

function ensureImageLoaded(id){
  if(Object.prototype.hasOwnProperty.call(imageCache, id) || imageFetchInFlight.has(id)) return;
  imageFetchInFlight.add(id);
  get(ref(db, getImagesPath(currentConversation) + '/' + id))
    .then(snap=>{ imageCache[id] = snap.exists() ? snap.val() : null; })
    .catch(()=>{ imageCache[id] = null; })
    .finally(()=>{ imageFetchInFlight.delete(id); renderMessages(); });
}

function buildMessageRow(m, lastSender, wasNearBottom, box){
  const mine = currentUser && m.senderId === currentUser.id;
  const isMedia = m.type === 'image' || m.type === 'gif';
  const row = document.createElement('div');
  row.className = 'msg-row ' + (mine ? 'mine':'theirs');
  let label = '';
  if(!mine && m.senderId !== lastSender){
    label = `<div class="sender-label">${escapeHtml(m.senderName)}</div>`;
  }
  row.innerHTML = `${label}<div class="bubble ${isMedia ? 'bubble-media':''}">${bubbleInner(m)}</div><div class="timestamp">${formatTime(m.ts)}</div>`;
  row.querySelectorAll('img').forEach(img=>{
    img.onclick = ()=> openLightbox(img.src);
    img.addEventListener('load', ()=>{
      if(wasNearBottom){ box.scrollTop = box.scrollHeight; }
    });
  });
  return row;
}

function renderMessages(){
  const box = document.getElementById('messages');
  const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;

  if(messages.length===0){
    box.innerHTML = `<div class="empty-state">No messages yet. Say hi 👋</div>`;
    lastRenderedIds = [];
    return;
  }

  const newIds = messages.map(m=>m.id);
  const canAppend = lastRenderedIds.length > 0 &&
    newIds.length >= lastRenderedIds.length &&
    lastRenderedIds.every((id, i)=> newIds[i] === id);

  if(canAppend){
    let lastSender = messages[lastRenderedIds.length - 1].senderId;
    messages.slice(lastRenderedIds.length).forEach(m=>{
      box.appendChild(buildMessageRow(m, lastSender, wasNearBottom, box));
      lastSender = m.senderId;
    });
  }else{
    box.innerHTML = '';
    let lastSender = null;
    messages.forEach(m=>{
      box.appendChild(buildMessageRow(m, lastSender, wasNearBottom, box));
      lastSender = m.senderId;
    });
  }

  lastRenderedIds = newIds;
  box.scrollTop = box.scrollHeight;
}

function fileToCompressedDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1000;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = ()=> reject(new Error('image decode failed'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

async function cleanupOldImages(imagesPath){
  try{
    const snap = await get(ref(db, imagesPath));
    if(!snap.exists()) return;
    const ids = Object.keys(snap.val()).sort();
    const MAX_IMAGES = 60;
    if(ids.length > MAX_IMAGES){
      const toRemove = ids.slice(0, ids.length - MAX_IMAGES);
      for(const rid of toRemove){
        try{ await remove(ref(db, imagesPath + '/' + rid)); }catch(e){}
        delete imageCache[rid];
      }
    }
  }catch(e){ /* non-fatal */ }
}

async function sendImageFile(file){

    const dataUrl = await fileToCompressedDataURL(file);
    const id = Date.now() + '-' + Math.random().toString(36).slice(2,7);
    const imagesPath = getImagesPath(currentConversation);
    await set(ref(db, imagesPath + '/' + id), dataUrl);
    imageCache[id] = dataUrl;
    const msg = {
      id: id + '-msg',
      senderId: currentUser.id,
      senderName: currentUser.name,
      type: 'image',
      imageId: id,
      ts: Date.now()
    };
    await set(ref(db, getConvoPath(currentConversation) + '/' + msg.id), msg);
    cleanupOldImages(imagesPath);
  }catch(e){
    alert("Couldn't send that photo. Try a different one, or a smaller file.");
  }
}

async function searchGifs(query){
  const endpoint = query
    ? `https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(query)}&limit=15&rating=g`
    : `https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY_KEY}&limit=15&rating=g`;

function startPolling(){
  stopPolling();
  const path = getConvoPath(currentConversation);
  const messagesRef = ref(db, path);
  messagesUnsub = onValue(messagesRef, (snapshot)=>{
    const val = snapshot.val() || {};
    let arr = Object.values(val).sort((a,b)=> a.ts - b.ts);
    const MAX_MESSAGES = 400;
    if(arr.length > MAX_MESSAGES){
      const excess = arr.slice(0, arr.length - MAX_MESSAGES);
      excess.forEach(m=>{ remove(ref(db, path + '/' + m.id)).catch(()=>{}); });
      arr = arr.slice(-MAX_MESSAGES);
    }
    messages = arr;
    if(renderDebounceTimer) clearTimeout(renderDebounceTimer);
    renderDebounceTimer = setTimeout(()=>{ renderDebounceTimer = null; renderMessages(); }, 50);
  }, (err)=>{ console.error('message listener failed', err); });
}
function stopPolling(){
  if(messagesUnsub){ messagesUnsub(); messagesUnsub = null; }
  if(renderDebounceTimer){ clearTimeout(renderDebounceTimer); renderDebounceTimer = null; }
}

      </div>
      <div class="pin-error" id="nameEditError"></div>
      <button class="primary-btn" id="nameEditSave">Save name</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('nameEditClose').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  const input = document.getElementById('nameEditInput');
  input.value = p.name;
  input.focus();
  input.select();
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); saveBtn.click(); } });

  const saveBtn = document.getElementById('nameEditSave');
  saveBtn.onclick = async ()=>{
    const val = input.value.trim();
    const err = document.getElementById('nameEditError');
    if(!val){ err.textContent = 'Name cannot be empty.'; return; }
    p.name = val;
    await saveConfig();
    if(currentUser && currentUser.id === p.id){ renderWhoRow(); }
    overlay.remove();
    if(onSaved) onSaved();
  };
}

function openPinEditor(participantId, onSaved){
  const p = config.participants.find(x=>x.id===participantId);
  if(!p) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal modal-wrap" style="max-width:320px;">
      <button class="close-x" id="pinEditClose">&times;</button>
      <h2>${p.pin ? 'Change' : 'Set'} PIN</h2>
      <p class="modal-sub">${escapeHtml(p.name)}'s 4-digit PIN for logging in.</p>
      <div class="field">
        <input type="text" id="pinEditInput" maxlength="4" inputmode="numeric" placeholder="4 digits"
          style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);color:var(--cream);font-size:1.2rem;text-align:center;letter-spacing:6px;" />
      </div>
      <div class="pin-error" id="pinEditError"></div>
      <button class="primary-btn" id="pinEditSave">Save PIN</button>
      ${p.pin ? '<button class="primary-btn" id="pinEditRemove" style="background:rgba(255,255,255,0.08);color:var(--accent-brick);margin-top:8px;">Remove PIN</button>' : ''}
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('pinEditClose').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  const input = document.getElementById('pinEditInput');
  input.focus();
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); saveBtn.click(); } });

  const saveBtn = document.getElementById('pinEditSave');
  saveBtn.onclick = async ()=>{
    const val = input.value.trim();
    const err = document.getElementById('pinEditError');
    if(!/^\d{4}$/.test(val)){ err.textContent = 'Enter exactly 4 digits.'; return; }
    p.pin = val;
    await saveConfig();
    renderPeopleGrid();
    overlay.remove();
    if(onSaved) onSaved();
  };

  const removeBtn = document.getElementById('pinEditRemove');
  if(removeBtn){
    removeBtn.onclick = async ()=>{
      p.pin = null;
      await saveConfig();
      renderPeopleGrid();
      overlay.remove();
      if(onSaved) onSaved();
    };
  }
}

function openManage(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'manageOverlay';
  overlay.innerHTML = `
    <div class="modal modal-wrap">
      <button class="close-x" id="manageClose">&times;</button>
      <h2>Manage Family</h2>
      <p class="modal-sub">Add or remove who can use EmeryChat.</p>
      <div id="rosterList"></div>
      <hr class="div"/>
      <h2 style="font-size:1.05rem;">Add someone</h2>
      <div class="field">
        <label>Name</label>
        <input type="text" id="newName" placeholder="e.g. Grandma" />
      </div>
      <div class="field">
        <label>Color</label>
        <div class="swatches" id="newSwatches"></div>
      </div>
      <div class="field">
        <label>4-digit PIN (optional, but recommended)</label>
        <input type="text" id="newPin" maxlength="4" inputmode="numeric" placeholder="Leave blank for no PIN" />
      </div>
      <div class="field checkrow">
        <input type="checkbox" id="newAdmin" style="width:16px;height:16px;" />
        <label for="newAdmin" style="margin:0;">Can also manage the family list</label>
      </div>
      <button class="primary-btn" id="addPersonBtn">Add to EmeryChat</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('manageClose').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  let selectedColor = 0;
  const swatchesEl = document.getElementById('newSwatches');
  COLORS.forEach((c, idx)=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (idx===0 ? ' selected':'');
    sw.style.background = c.hex;
    sw.onclick = ()=>{
      selectedColor = idx;
      [...swatchesEl.children].forEach(ch=>ch.classList.remove('selected'));
      sw.classList.add('selected');
    };
    swatchesEl.appendChild(sw);
  });

  renderRoster();

  document.getElementById('addPersonBtn').onclick = async ()=>{
    const name = document.getElementById('newName').value.trim();
    if(!name){ document.getElementById('newName').focus(); return; }
    const pinRaw = document.getElementById('newPin').value.trim();
    const pin = /^\d{4}$/.test(pinRaw) ? pinRaw : null;
    const isAdmin = document.getElementById('newAdmin').checked;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now().toString(36).slice(-4);
    config.participants.push({id, name, colorIdx: selectedColor, pin, isAdmin});
    await saveConfig();
    renderRoster();
    renderPeopleGrid();
    document.getElementById('newName').value='';
    document.getElementById('newPin').value='';
    document.getElementById('newAdmin').checked=false;
  };

  function renderRoster(){
    const list = document.getElementById('rosterList');
    list.innerHTML = '';
    config.participants.forEach(p=>{
      const row = document.createElement('div');
      row.className = 'roster-item';
      row.innerHTML = `
        <div class="avatar" style="background:${colorFor(p.colorIdx)}">${initials(p.name)}</div>
        <div class="roster-name">${escapeHtml(p.name)} ${p.pin ? '🔒' : ''}</div>
        ${p.isAdmin ? '<span class="roster-tag">manager</span>' : ''}
        <button class="pin-btn" data-id="${p.id}">Edit name</button>
        <button class="pin-btn" data-id="${p.id}">${p.pin ? 'Change PIN' : 'Set PIN'}</button>
        <button class="remove-btn" data-id="${p.id}">Remove</button>
      `;
      const [editNameBtn, editPinBtn, removeBtn] = row.querySelectorAll('.pin-btn, .remove-btn');
      editNameBtn.onclick = ()=> openNameEditor(p.id, renderRoster);
      editPinBtn.onclick = ()=> openPinEditor(p.id, renderRoster);
      removeBtn.onclick = async ()=>{
        if(config.participants.length<=1) return;
        if(!confirm(`Remove ${p.name} from EmeryChat?`)) return;
        config.participants = config.participants.filter(x=>x.id!==p.id);
        await saveConfig();
        renderRoster();
        renderPeopleGrid();
        if(currentUser && currentUser.id===p.id){ logOut(); overlay.remove(); }
      };
      list.appendChild(row);
    });
  }
}

document.getElementById('pinBack').onclick = ()=>{
  pendingLoginId = null; pinBuffer='';
  showScreen('loginScreen');
};
document.getElementById('sendBtn').onclick = sendMessage;
const msgInput = document.getElementById('msgInput');
msgInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
msgInput.addEventListener('input', ()=>{
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
});

document.getElementById('imageBtn').onclick = ()=> document.getElementById('imageInput').click();
document.getElementById('imageInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) sendImageFile(file);
  e.target.value = '';
});
document.getElementById('gifBtn').onclick = openGifPicker;
document.getElementById('emojiBtn').onclick = toggleEmojiPanel;
document.addEventListener('click', (e)=>{
  const panel = document.getElementById('emojiPanel');
  if(!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target.id !== 'emojiBtn'){
    panel.classList.add('hidden');
  }
});

document.getElementById('pwSubmit').onclick = attemptUnlock;
document.getElementById('householdPassword').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); attemptUnlock(); }
});

async function attemptUnlock(){
  const input = document.getElementById('householdPassword');
  const err = document.getElementById('pwError');
  const submitBtn = document.getElementById('pwSubmit');
  const pwd = input.value;
  if(!pwd){ return; }
  err.textContent = '';
  input.disabled = true;
  submitBtn.disabled = true;
  try{
    await signInWithEmailAndPassword(auth, HOUSEHOLD_EMAIL, pwd);
    input.value = '';
    // onAuthStateChanged below handles moving to the login screen
  }catch(e){
    err.textContent = "That password doesn't match. Try again.";
    input.value = '';
  }finally{
    input.disabled = false;
    submitBtn.disabled = false;
  }
}

buildPinPad();

onAuthStateChanged(auth, async (user)=>{
  if(user){
    await loadConfig();
    renderPeopleGrid();
    showScreen('loginScreen');
  }else{
    showScreen('passwordScreen');
    document.getElementById('householdPassword').focus();
  }
});
</script>
